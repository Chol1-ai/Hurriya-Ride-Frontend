<body class="bg-surface text-on-surface font-body-sm text-body-sm h-screen w-full overflow-hidden flex flex-col relative selection:bg-primary selection:text-on-primary">
<!-- TopAppBar (Adapted for Active Trip context, suppressing standard Nav/BottomNav) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-xl h-16 bg-surface-dim shadow-md bg-surface-container-high border-b border-outline-variant transition-transform">
<div class="flex items-center gap-gutter-sm">
<span class="material-symbols-outlined text-primary scale-95 duration-100 active:opacity-80 transition-opacity" data-icon="navigation" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                navigation
            </span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">
                En Route to Pickup
            </h1>
</div>
<div class="bg-surface-container-highest px-3 py-1 rounded-full flex items-center justify-center">
<span class="font-micro-bold text-micro-bold text-safety-emerald tracking-wider uppercase">3 min</span>
</div>
</header><div class="fixed top-16 left-0 w-full z-40 bg-surface-container-highest border-b border-primary/20 p-gutter-md flex items-center gap-gutter-md shadow-lg">
<div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-primary-fixed text-display-xl">turn_left</span>
</div>
<div class="flex flex-col">
<span class="text-primary font-label-bold uppercase tracking-widest">300m</span>

</div>
</div>

<div class="absolute inset-0 w-full h-full map-gradient-overlay z-10 pointer-events-none"></div><div class="absolute bottom-margin-lg left-1/2 -translate-x-1/2 z-20 bg-surface-dim/90 backdrop-blur-md border border-outline-variant px-6 py-3 rounded-full flex items-center gap-gutter-md shadow-xl">
<div class="flex items-center gap-unit">
<span class="material-symbols-outlined text-utility-cyan text-[18px]">distance</span>
<span class="font-subhead-md text-on-background">2.4 km</span>
</div>
<div class="w-px h-4 bg-outline-variant"></div>
<div class="flex items-center gap-unit">
<span class="material-symbols-outlined text-safety-emerald text-[18px]">schedule</span>
<span class="font-subhead-md text-on-background">8 min</span>
</div>
</div>
<!-- Floating SOS Button (Contextual Safety) -->
<button aria-label="Emergency SOS" class="absolute top-margin-lg right-margin-xl z-40 bg-error text-on-error w-14 h-14 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform duration-200 border-2 border-error-container">
<span class="material-symbols-outlined text-display-xl" data-icon="sos" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                sos
            </span>
</button>
</main>

<section class="absolute bottom-0 w-full z-50 bg-surface-container rounded-t-3xl shadow-[0_-15px_40px_rgba(0,0,0,0.6)] border-t border-slate-border flex flex-col pt-3 pb-8 px-margin-xl gap-section-gap transition-transform duration-300 ease-out translate-y-0">

<div class="w-12 h-1.5 bg-surface-variant rounded-full mx-auto mb-2"></div>
<div class="flex flex-col gap-margin-lg">

</div>
<div class="flex flex-col">
<span class="font-subhead-md text-subhead-md text-white-high-emphasis">Malou G.</span>
<div class="flex items-center gap-1 mt-0.5 text-primary">
<span class="material-symbols-outlined text-[16px]" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                                star
                            </span>
<span class="font-label-bold text-label-bold">4.8</span>
<span class="font-body-sm text-body-sm text-on-surface-variant ml-1">(Rider)</span>
</div>
</div>
</div>
<!-- Secondary Quick Action inside Rider Card -->
<button class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center active:bg-surface-bright transition-colors hover:scale-105 duration-200">
<span class="material-symbols-outlined" data-icon="chat">
                        chat
                    </span>
</button>
</div>
<!-- Address Display -->
<div class="flex items-center gap-gutter-md bg-surface-container-highest rounded-xl p-gutter-md border border-slate-border hollow-input">
<span class="material-symbols-outlined text-utility-cyan shrink-0" data-icon="location_on" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                    location_on
                </span>
<div class="flex flex-col overflow-hidden">
<span class="font-micro-bold text-micro-bold text-on-surface-variant uppercase tracking-wider mb-1">Pickup Location</span>
<span class="font-subhead-md text-subhead-md text-on-background truncate">Konyo Konyo Market, Gate 2</span>
</div>
</div>
<!-- Primary Actions (Large format, driver-focused) -->
<div class="flex flex-col gap-gutter-sm mt-2">
<button class="w-full py-4 rounded-xl border-2 border-primary text-primary font-label-bold text-label-bold flex items-center justify-center gap-unit active:bg-surface-variant transition-colors uppercase tracking-widest">
<span class="material-symbols-outlined text-[18px]" data-icon="call">
                        call
                    </span>
                    Call Rider
                </button>
<button class="w-full py-5 rounded-2xl bg-safety-emerald text-on-tertiary-fixed font-headline-lg-mobile text-headline-lg-mobile text-center flex items-center justify-center gap-gutter-sm glow-emerald active:scale-[0.98] transition-all duration-200 shadow-xl border border-tertiary-fixed-dim">
