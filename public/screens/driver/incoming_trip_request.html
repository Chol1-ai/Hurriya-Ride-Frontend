<script>
        // Simple countdown logic for visual demonstration
        const timerText = document.getElementById('timer-text');
        const timerProgress = document.getElementById('timer-progress');
        let timeLeft = 15;
        const totalTime = 15;
        const circumference = 2 * Math.PI * 45; // r=45

        const countdown = setInterval(() => {
            timeLeft--;
            timerText.textContent = timeLeft;
            
            const offset = circumference - (timeLeft / totalTime) * circumference;
            timerProgress.style.strokeDashoffset = offset;

            // Visual tension as time runs out
            if (timeLeft <= 5) {
                timerProgress.style.stroke = '#ef4444'; // Red for critical
                timerText.classList.replace('text-primary-container', 'text-error');
            }

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerText.textContent = "0";
                // Simulate missed trip state or close screen
            }
        }, 1000);
    </script>
