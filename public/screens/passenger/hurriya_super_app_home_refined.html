        body {
            background-color: theme('colors.midnight-bg');
            color: theme('colors.on-surface');
            -webkit-font-smoothing: antialiased;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid theme('colors.slate-border');
        }
        .gold-glow {
            box-shadow: 0px 10px 15px -3px rgba(245, 158, 11, 0.2);

<body class="pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md shadow-sm flex items-center justify-between px-margin-lg h-16 transition-colors duration-200">
<div class="flex items-center gap-3">

<span class="font-micro-reg text-micro-reg text-on-surface-variant">Good Morning,</span>
<span class="font-subhead-md text-subhead-md text-primary">Alex</span>
</div>
</div>
<button class="text-on-surface-variant hover:bg-surface-variant/20 p-2 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content -->
<main class="pt-20 px-margin-lg space-y-section-gap max-w-lg mx-auto">
<!-- Wallet Card -->
<section>
<div class="bg-gradient-to-br from-primary-container to-primary-fixed rounded-xl p-gutter-md gold-glow relative overflow-hidden">
<div class="absolute -top-10 -right-10 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl"></div>
<div class="flex justify-between items-start mb-4">
<div>
<p class="font-label-bold text-label-bold text-on-primary-container opacity-80">Total Balance</p>
<h2 class="font-display-xl text-display-xl text-on-primary font-black">12,500 SSP</h2>
</div>
<span class="material-symbols-outlined text-on-primary text-3xl" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<div class="flex gap-3 mt-6">
<button class="flex-1 bg-surface text-primary font-label-bold text-label-bold py-2 rounded-lg hover:bg-surface-variant transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span> Deposit
                    </button>
<button class="flex-1 bg-transparent border border-on-primary text-on-primary font-label-bold text-label-bold py-2 rounded-lg hover:bg-on-primary/10 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="history">history</span> History
                    </button>
</div>
</div>
</section>
<!-- Service Grid -->
<section>
<h3 class="font-subhead-md text-subhead-md text-on-surface mb-4">Where to?</h3>
<div class="grid grid-cols-2 gap-gutter-md">
<button class="glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:border-primary transition-colors group">
<div class="w-12 h-12 bg-surface-container rounded-full flex items-center justify-center group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="two_wheeler">two_wheeler</span>
</div>
<span class="font-label-bold text-label-bold text-on-surface">Boda</span>
</button>
<button class="glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:border-primary transition-colors group">
<div class="w-12 h-12 bg-surface-container rounded-full flex items-center justify-center group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="electric_rickshaw">electric_rickshaw</span>
</div>
<span class="font-label-bold text-label-bold text-on-surface">Tuktuk</span>
</button>
<button class="glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:border-primary transition-colors group">
<div class="w-12 h-12 bg-surface-container rounded-full flex items-center justify-center group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="local_taxi">local_taxi</span>
</div>
<span class="font-label-bold text-label-bold text-on-surface">Car</span>
</button>
<button class="glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:border-primary transition-colors group">
<div class="w-12 h-12 bg-surface-container rounded-full flex items-center justify-center group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="local_shipping">local_shipping</span>
</div>
<span class="font-label-bold text-label-bold text-on-surface">Package</span>
</button>
</div>
</section>
<!-- Safety Banner -->
<section>
<div class="bg-safety-emerald/10 border border-safety-emerald/30 rounded-xl p-4 flex items-center gap-4">
<div class="bg-safety-emerald/20 p-2 rounded-full">
<span class="material-symbols-outlined text-safety-emerald" data-icon="verified_user" style="font-variation-settings: 'FILL' 1;">verified_user</span>
</div>
<div>
<h4 class="font-label-bold text-label-bold text-safety-emerald">Juba Safety Pledge</h4>
<p class="font-micro-reg text-micro-reg text-on-surface-variant mt-1">All rides monitored &amp; verified.</p>
</div>
</div>
</section>
<!-- Recent Activity -->
<section>
<div class="flex justify-between items-center mb-4">
<h3 class="font-subhead-md text-subhead-md text-on-surface">Recent Activity</h3>
<button class="text-primary font-label-bold text-label-bold">See All</button>
</div>
<div class="space-y-3">
<div class="glass-card rounded-xl p-3 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-surface-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="local_taxi">local_taxi</span>
</div>
<div>

<p class="font-micro-reg text-micro-reg text-on-surface-variant">Yesterday, 14:30</p>
</div>
</div>
<span class="font-label-bold text-label-bold text-on-surface">-3,500 SSP</span>
</div>
<div class="glass-card rounded-xl p-3 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-surface-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<div>
<p class="font-label-bold text-label-bold text-on-surface">Wallet Top-up</p>
<p class="font-micro-reg text-micro-reg text-on-surface-variant">Yesterday, 10:00</p>
</div>
</div>
<span class="font-label-bold text-label-bold text-safety-emerald">+10,000 SSP</span>
</div>
</div>
</section>
</main>

<nav class="fixed bottom-0 w-full z-50 rounded-t-xl border-t border-slate-border shadow-[0px_-4px_10px_rgba(0,0,0,0.1)] flex justify-around items-center h-20 px-gutter-md pb-safe bg-surface-container md:hidden">
<button class="flex flex-col items-center justify-center bg-primary-container/10 text-primary rounded-xl px-4 py-1 scale-95 active:scale-90 transition-transform">

<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant scale-95 active:scale-90 transition-transform px-4 py-1 rounded-xl">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-label-bold text-label-bold">Activity</span>

<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
