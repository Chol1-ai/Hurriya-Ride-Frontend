<!DOCTYPE html>

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {

                        "utility-cyan": "#22D3EE",
                        "tertiary-fixed": "#68fcbf",
                        "secondary-container": "#3f465c",
                        "primary": "#ffc174",
                        "on-primary": "#472a00",
                        "surface-container-highest": "#273647",
                        "on-surface": "#d4e4fa",
                        "surface-container-low": "#0d1c2d",
                        "outline": "#a08e7a",
                        "surface": "#051424",
                        "outline-variant": "#534434",
                        "secondary": "#bec6e0",
                        "on-surface-variant": "#d8c3ad",
                        "inverse-on-surface": "#233143",
                        "surface-container-lowest": "#010f1f",
                        "surface-container": "#122131",
                        "secondary-fixed-dim": "#bec6e0",
                        "error": "#ffb4ab",
                        "on-tertiary": "#003825",
                        "on-primary-container": "#613b00",
                        "on-error": "#690005",
                        "primary-container": "#f59e0b",
                        "surface-container-high": "#1c2b3c",
                        "on-tertiary-fixed-variant": "#005137",
                        "error-container": "#93000a",
                        "on-primary-fixed": "#2a1700",
                        "on-secondary-container": "#adb4ce",
                        "secondary-fixed": "#dae2fd",
                        "inverse-primary": "#855300",
                        "utility-indigo": "#818CF8",
                        "primary-fixed": "#ffddb8",
                        "primary-fixed-dim": "#ffb95f",
                        "background": "#051424",
                        "slate-surface": "#1E293B",
                        "on-secondary-fixed-variant": "#3f465c",
                        "safety-emerald": "#34D399",
                        "on-tertiary-fixed": "#002114",
                        "surface-dim": "#051424",
                        "white-high-emphasis": "#FFFFFF",
                        "inverse-surface": "#d4e4fa",
                        "on-background": "#d4e4fa",
                        "on-secondary-fixed": "#131b2e",
                        "on-error-container": "#ffdad6",
                        "surface-variant": "#273647",
                        "tertiary-container": "#22c990",
                        "on-tertiary-container": "#004e35",
                        "tertiary": "#4de6aa",
                        "tertiary-fixed-dim": "#45dfa4",
                        "surface-bright": "#2c3a4c",
                        "on-secondary": "#283044",
                        "midnight-bg": "#020617",
                        "on-primary-fixed-variant": "#653e00",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {

                        "unit": "4px",

                        "gutter-sm": "12px",

                        "display-xl": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "800" }]

                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');

        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
            }

            80%,
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .pulse-core {
            animation: pulse-core 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }

        @keyframes pulse-core {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 180, 171, 0.7);
            }

            50% {
                transform: scale(1);
                box-shadow: 0 0 0 20px rgba(255, 180, 171, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 180, 171, 0);
            }
        }

        .audio-wave {
            display: inline-flex;
            align-items: center;
            height: 24px;
            gap: 2px;
        }

        .audio-wave span {
            display: inline-block;
            width: 3px;
            background-color: currentColor;
            border-radius: 9999px;
            animation: wave 1.2s ease-in-out infinite;
        }

        .audio-wave span:nth-child(1) {
            height: 8px;
            animation-delay: -1.2s;
        }

        .audio-wave span:nth-child(2) {
            height: 16px;
            animation-delay: -1.1s;
        }

        .audio-wave span:nth-child(3) {
            height: 24px;
            animation-delay: -1.0s;
        }

        .audio-wave span:nth-child(4) {
            height: 12px;
            animation-delay: -0.9s;
        }

        .audio-wave span:nth-child(5) {
            height: 18px;
            animation-delay: -0.8s;
        }

        @keyframes wave {

            0%,
            100% {
                height: 4px;
            }

            50% {
                height: 24px;
            }
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-surface text-on-surface h-screen w-full flex flex-col font-body-sm overflow-hidden select-none">
    <!-- TopAppBar Nav suppression due to transactional/high-urgency state -->
    <main class="flex-grow flex flex-col items-center justify-center p-margin-xl relative z-10">
        <!-- Background Ambient Glow -->
        <div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none overflow-hidden">
            <div class="w-[150vw] h-[150vw] rounded-full bg-error opacity-10 blur-[100px] animate-pulse"></div>
        </div>
        <div class="relative z-10 flex flex-col items-center w-full max-w-sm mx-auto text-center space-y-section-gap">
            <!-- Shield Graphic -->
            <div class="relative w-48 h-48 flex items-center justify-center">
                <div class="absolute inset-0 rounded-full border-4 border-error opacity-50 pulse-ring"></div>
                <div class="absolute inset-4 rounded-full border-2 border-error opacity-70 pulse-ring"
                    style="animation-delay: 0.5s;"></div>
                <div
                    class="w-32 h-32 bg-error rounded-full flex items-center justify-center pulse-core shadow-[0_0_40px_rgba(255,180,171,0.5)]">
                    <span class="material-symbols-outlined text-[64px] text-on-error"
                        style="font-variation-settings: 'FILL' 1;">
                        shield
                    </span>
                </div>
            </div>
            <!-- Status Text -->
            <div class="space-y-gutter-sm w-full">
                <h1 class="font-display-xl text-display-xl text-error">Active Emergency</h1>
                <p class="font-subhead-md text-subhead-md text-on-surface">Notifying Emergency Services</p>
                <div class="bg-surface-container-high rounded-xl p-gutter-md mt-gutter-md border border-slate-border">
                    <div class="flex items-center justify-between mb-unit">
                        <span class="font-label-bold text-label-bold text-secondary">DISPATCH STATUS</span>
                        <span class="font-label-bold text-label-bold text-primary">00:45 ETA</span>
                    </div>
                    <div class="w-full h-2 bg-surface-container-low rounded-full overflow-hidden">
                        <div class="h-full bg-primary w-1/3 rounded-full relative">
                            <div
                                class="absolute top-0 right-0 bottom-0 w-8 bg-gradient-to-r from-transparent to-white opacity-50">
                            </div>
                        </div>
                    </div>
                    <p class="font-micro-reg text-micro-reg text-on-surface-variant mt-unit text-left">Police unit
                        dispatched to your location.</p>
                </div>
            </div>
            <!-- Audio Recording Indicator -->
            <div
                class="flex items-center justify-center gap-gutter-sm text-error bg-error-container/20 px-gutter-md py-unit rounded-full border border-error/30 mt-section-gap w-auto inline-flex backdrop-blur-sm">
                <div class="audio-wave text-error">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <span class="font-label-bold text-label-bold">Recording Audio for Safety</span>
            </div>
        </div>
    </main>
    <!-- Bottom Action Area -->
    <div
        class="p-margin-xl w-full z-20 pb-[calc(24px+env(safe-area-inset-bottom))] bg-gradient-to-t from-surface via-surface/90 to-transparent">
        <button
            class="w-full py-gutter-md rounded-lg border-2 border-slate-border bg-transparent text-white-high-emphasis font-subhead-md text-subhead-md transition-all active:scale-95 active:bg-surface-container-high flex items-center justify-center gap-unit">
            <span class="material-symbols-outlined">check_circle</span>
            Cancel (I am safe)
        </button>
    </div>
</body>

</html>
