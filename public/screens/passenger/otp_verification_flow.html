<style>
        .gold-glow {
            box-shadow: 0px 10px 15px -3px rgba(245, 158, 11, 0.2);
        }
        .otp-input::-webkit-outer-spin-button,
        .otp-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .otp-input[type=number] {
            -moz-appearance: textfield;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-sm">
<!-- Top App Bar - Simplified for transactional screen -->
<header class="flex items-center px-margin-lg h-16 w-full max-w-7xl mx-auto z-50">
<button aria-label="Go Back" class="p-2 rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-start px-margin-lg pt-12 max-w-md mx-auto w-full">
<!-- Header Section -->
<div class="w-full mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Verify Phone</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                We've sent a 4-digit code to <br>
<span class="text-on-surface font-bold">+211 9XX XXX XXX</span>
</p>
</div>
<!-- OTP Input Section -->
<div class="w-full flex justify-between gap-4 mb-8">
<input aria-label="Digit 1" class="otp-input w-16 h-16 text-center bg-midnight-bg border border-slate-border rounded-xl font-headline-lg text-headline-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" maxlength="1" type="number">
<input aria-label="Digit 2" class="otp-input w-16 h-16 text-center bg-midnight-bg border border-slate-border rounded-xl font-headline-lg text-headline-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" maxlength="1" type="number">
<input aria-label="Digit 3" class="otp-input w-16 h-16 text-center bg-midnight-bg border border-slate-border rounded-xl font-headline-lg text-headline-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" maxlength="1" type="number">
<input aria-label="Digit 4" class="otp-input w-16 h-16 text-center bg-midnight-bg border border-slate-border rounded-xl font-headline-lg text-headline-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" maxlength="1" type="number">
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-midnight-bg font-label-bold text-label-bold py-4 rounded-xl gold-glow hover:opacity-90 active:scale-95 transition-all mb-6">
            Verify &amp; Continue
        </button>
<!-- Resend Section -->
<div class="w-full text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant mb-2">Didn't receive the code?</p>
<div class="flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" data-icon="schedule">schedule</span>
<span class="font-label-bold text-label-bold text-primary">00:59</span>
</div>
<!-- Hidden Resend Button (shown when timer expires) -->
<button class="hidden font-label-bold text-label-bold text-primary mt-2 hover:underline">
                Resend Code
            </button>
</div>
</main>
<script>
        // Simple OTP input focus logic
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
        
        // Auto-focus first input on load
        window.addEventListener('DOMContentLoaded', () => {
            if(inputs.length > 0) inputs[0].focus();
        });
    </script>
</body></html>
