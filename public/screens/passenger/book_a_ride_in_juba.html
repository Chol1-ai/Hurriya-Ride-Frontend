<script>
        // Simple script to handle vehicle selection visual feedback
        const vehicleButtons = document.querySelectorAll('.grid > button');
        vehicleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Reset all to inactive state
                vehicleButtons.forEach(b => {
                    b.className = "bg-surface-container border border-slate-border hover:border-primary rounded-lg p-3 flex flex-col items-center gap-2 transition-all group focus:border-primary focus:bg-surface-container-low";
                    const icon = b.querySelector('.material-symbols-outlined');
                    icon.classList.remove('text-primary');
                    icon.classList.add('text-on-surface-variant', 'group-hover:text-primary');
                    // Remove fast badge if exists
                    const badge = b.querySelector('.absolute');
                    if(badge) badge.remove();
                });
                
                // Set clicked to active state
                btn.className = "bg-surface-container-low border-2 border-primary rounded-lg p-3 flex flex-col items-center gap-2 transition-all group relative";
                const icon = btn.querySelector('.material-symbols-outlined');
                icon.classList.remove('text-on-surface-variant', 'group-hover:text-primary');
                icon.classList.add('text-primary');
            });
        });
    </script>
