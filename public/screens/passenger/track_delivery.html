<script>
        // Simple script to slightly animate the courier marker for realism
        document.addEventListener('DOMContentLoaded', () => {
            const marker = document.getElementById('courier-marker');
            if(marker) {
                let pos = 40;
                let dir = 1;
                setInterval(() => {
                    pos += 0.5 * dir;
                    if(pos > 50 || pos < 30) dir *= -1;
                    marker.style.top = `${pos}%`;
                    marker.style.left = `${pos}%`;
                }, 1000);
            }
        });
    </script>
